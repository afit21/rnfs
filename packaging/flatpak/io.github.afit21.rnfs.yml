# Flatpak manifest for rnfs (a command-line app and daemon).
#
#   python3 packaging/flatpak/generate-sources.py      # refresh the pinned wheels (python3-deps.json, build-sources.json)
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.afit21.rnfs.yml
#   flatpak run io.github.afit21.rnfs daemon
#
# A bundle for the GitHub Release is built by .github/workflows/release.yml (flatpak/flatpak-github-actions).
app-id: io.github.afit21.rnfs
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rnfs
finish-args:
  # Reticulum's TCP/UDP/Auto interfaces, the local API (127.0.0.1:8788) and the gateway (127.0.0.1:8789).
  # The host's network namespace is shared, so a host rnsd's shared instance and host `rnfs` clients work too
  - --share=network
  # rnfs keeps its state in ~/.rnfs and Reticulum's in ~/.reticulum, the same directories a pip-installed rnfs
  # uses, and reads files you add and writes files you get in Downloads. Not the whole home: rnfs parses
  # untrusted network input, and a compromised daemon that can write ~/.bashrc has left the sandbox. Grant
  # other folders yourself, e.g. a Reticulum config in ~/.config/reticulum or a data disk:
  #   flatpak override --user --filesystem=~/.config/reticulum io.github.afit21.rnfs
  #   flatpak override --user --filesystem=/mnt/data io.github.afit21.rnfs
  - --filesystem=~/.rnfs:create
  - --filesystem=~/.reticulum:create
  - --filesystem=xdg-download
  # No devices by default. Serial ports (/dev/ttyUSB*, /dev/ttyACM*) for RNode, KISS and serial interfaces need
  # every device, since Flatpak has no serial-only permission:
  #   flatpak override --user --device=all io.github.afit21.rnfs
modules:
  # rns, cryptography, ... as pinned PyPI wheels (generated by generate-sources.py)
  - python3-deps.json

  - name: rnfs
    buildsystem: simple
    build-commands:
      # Built with build isolation from the bundled setuptools wheel (offline); dependencies come from python3-deps
      - pip3 install --verbose --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-deps .
      - ${FLATPAK_DEST}/bin/rnfs --version
    sources:
      # The checkout, without what isn't needed to build rnfs or is left by local builds, tests and lint (each
      # .gitignore entry that isn't a pattern). Entries are paths from the top of the checkout, not patterns
      - type: dir
        path: ../..
        skip:
          - .git
          - .github
          - .flatpak-builder
          - build-dir
          - build
          - dist
          - tests
          - packaging
          - __pycache__
          - rnfs.egg-info
          - .venv
          - venv
          - .ruff_cache
          - .hypothesis
          - .coverage
          - htmlcov
          - bandit
      - build-sources.json
