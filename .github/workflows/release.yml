name: release

# Push a tag vX.Y.Z (matching rnfs.__version__) to build every package and publish a GitHub Release with them,
# SHA256SUMS and signed build provenance. Run it by hand (workflow_dispatch, on any branch or tag) to build the
# same artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs and the Flatpak and Debian containers to digests (the comments say which
# tag); update them together. Values from expressions reach run: scripts only through env:, never spliced in.
# Build tools come from packaging/build-tools.lock and the build backend from it (or build-backend.lock) with
# --require-hashes, and builds run without build isolation, so nothing unpinned is fetched for a build.
jobs:
  # The whole tests workflow (unit and end-to-end tests on every OS and Python, lint, packaging smoke tests);
  # the release waits for it
  tests:
    uses: ./.github/workflows/tests.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # no token left in .git/config for the build code that runs next
      - id: version
        name: Read rnfs.__version__ (and check it matches the tag)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' rnfs/__init__.py)
          [ -n "$version" ] || { echo "::error::can't read __version__ from rnfs/__init__.py"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match rnfs.__version__ $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  python:
    name: wheel and sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # no token left in .git/config for the build code that runs next
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install the build tools (packaging/build-tools.lock, hash-checked)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/build-tools.lock
      # twine check and the sdist's contents are checked in the tests job (tests.yml's packaging job)
      - run: python -m build --no-isolation
      - name: Smoke test the wheel (with the locked dependencies)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements.lock
          /tmp/wheel-venv/bin/python -m pip install --no-deps dist/rnfs-*.whl
          /tmp/wheel-venv/bin/python -m pip check
          python packaging/smoke_test.py /tmp/wheel-venv/bin/rnfs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  deb:
    name: deb (${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both are built here from wheels downloaded for the target platform; only amd64 is run in CI
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # no token left in .git/config for the build code that runs next
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: sh packaging/build-deb.sh --arch "$ARCH" --out dist
        env:
          ARCH: ${{ matrix.arch }}
      - run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb | grep -v '/opt/rnfs/lib/.'
      - name: Install and smoke test (Ubuntu runner)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get install -y ./dist/rnfs_*_amd64.deb
          rnfs --version
          python3 packaging/smoke_test.py /usr/bin/rnfs
          sudo apt-get remove -y rnfs
      # The .deb is uploaded, checksummed and attested next, so the container must not be able to change it:
      # the checkout is mounted read-only (the .deb is copied out to be installed), the image is pinned by
      # digest (debian:12, the multi-arch index as of 2026-10-14), and only apt-get runs as root; the smoke
      # test runs as nobody
      - name: Install and smoke test (Debian 12, Python 3.11)
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --security-opt no-new-privileges -v "$PWD:/w:ro" -w /w \
            debian:12@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858 sh -ec '
            cp dist/rnfs_*_amd64.deb /tmp/
            apt-get update -qq
            apt-get install -y -qq /tmp/rnfs_*_amd64.deb >/dev/null
            python3 --version
            mkdir /tmp/smoke
            chown nobody:nogroup /tmp/smoke
            HOME=/tmp/smoke TMPDIR=/tmp/smoke setpriv --reuid=nobody --regid=nogroup --clear-groups \
              python3 packaging/smoke_test.py /usr/bin/rnfs'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  flatpak-sources:
    name: flatpak sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # no token left in .git/config for the build code that runs next
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # The Flatpak's wheels must be the ones packaging/requirements.lock pins (what every other package
      # installs): regenerate them from the lock and fail if that changes the committed files
      - name: Check the pinned Flatpak wheels match packaging/requirements.lock
        run: |
          python -I packaging/flatpak/generate-sources.py
          git diff --exit-code -- packaging/flatpak || {
            echo "::error::packaging/flatpak/*.json is out of date: run python3 packaging/flatpak/generate-sources.py and commit"
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: flatpak-sources
          path: packaging/flatpak/*.json

  flatpak:
    needs: [version, flatpak-sources]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # no token left in .git/config for the build code that runs next
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: flatpak-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3  # v6
        with:
          manifest-path: packaging/flatpak/io.github.afit21.rnfs.yml
          bundle: rnfs.flatpak
          arch: x86_64
          # No Actions cache: any default-branch workflow can write one, and a restored cache would go into the
          # attested bundle
          cache: false
          upload-artifact: false
      - name: Install and smoke test the bundle
        # Best effort: running sandboxed apps inside the CI container depends on the runner's kernel settings
        continue-on-error: true
        run: |
          flatpak install --user -y --noninteractive rnfs.flatpak
          flatpak run io.github.afit21.rnfs --version
          if command -v python3 >/dev/null; then
            mkdir -p "$HOME/smoke-tmp"
            # The sandbox reaches only ~/.rnfs, ~/.reticulum and Downloads unless granted more
            flatpak override --user --filesystem="$HOME/smoke-tmp" io.github.afit21.rnfs
            TMPDIR="$HOME/smoke-tmp" python3 packaging/smoke_test.py flatpak run io.github.afit21.rnfs
          fi
      - name: Name it for the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mv rnfs.flatpak "rnfs-$VERSION-x86_64.flatpak"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-flatpak-x86_64
          path: rnfs-*.flatpak
          if-no-files-found: error

  windows:
    name: windows exe
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # no token left in .git/config for the build code that runs next
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # The dependencies are the exact versions and files in packaging/requirements.lock, and PyInstaller and
      # setuptools those in packaging/build-tools.lock (both hash-checked)
      - name: Install rnfs, its locked dependencies and PyInstaller
        shell: bash  # stops at the first failing command (pwsh would only check the last one)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/build-tools.lock
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Build the one-file exe
        run: pyinstaller --clean --noconfirm packaging/pyinstaller/rnfs.spec
      - name: Smoke test (--version, --help, daemon + status)
        run: python packaging/smoke_test.py dist/rnfs.exe
        timeout-minutes: 10
      - name: Name it for the release
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mv dist/rnfs.exe "dist/rnfs-$VERSION-windows-x64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-windows-x64
          path: dist/rnfs-*-windows-x64.exe
          if-no-files-found: error

  release:
    # Only for a pushed tag: a manual run builds the artifacts without publishing, even when started on a tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [tests, version, python, deb, flatpak, windows]
    runs-on: ubuntu-latest
    # Protection rules (required reviewers, which tags may deploy) are set on this environment in the
    # repository's settings, so publishing can be gated beyond whoever can push a v* tag
    environment: release
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation (Sigstore certificate for this workflow run)
      attestations: write  # store it with the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # Signed SLSA build provenance for every file, which users can check with
      # gh attestation verify FILE --repo afit21/rnfs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        # A release already made for this tag on GitHub's release page gets the files attached rather than
        # failing; otherwise the release is created here. Files already attached are never replaced (no
        # --clobber): users may have downloaded and checked them, so a re-run with the same names fails instead
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "rnfs $VERSION" \
              --generate-notes \
              --verify-tag
          fi
