name: release

# Tag vX.Y.Z (matching rnfs.__version__) to build every package and publish a GitHub Release with them and
# SHA256SUMS. Run it by hand (workflow_dispatch) to build the same artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs and the Flatpak container to a digest (the comments say which tag);
# update both together. Values from expressions reach run: scripts only through env:, never spliced in.
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - id: version
        name: Read rnfs.__version__ (and check it matches the tag)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' rnfs/__init__.py)
          [ -n "$version" ] || { echo "::error::can't read __version__ from rnfs/__init__.py"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match rnfs.__version__ $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  python:
    name: wheel and sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check the sdist leaves out the tests, but has the dependency lock (install.sh uses it)
        run: |
          ! tar tzf dist/rnfs-*.tar.gz | grep -q '/tests/'
          tar tzf dist/rnfs-*.tar.gz | grep -q '/packaging/requirements.lock$'
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/rnfs-*.whl
          python packaging/smoke_test.py /tmp/wheel-venv/bin/rnfs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  deb:
    name: deb (${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both are built here from wheels downloaded for the target platform; only amd64 is run in CI
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: sh packaging/build-deb.sh --arch "$ARCH" --out dist
        env:
          ARCH: ${{ matrix.arch }}
      - run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb | grep -v '/opt/rnfs/lib/.'
      - name: Install and smoke test (Ubuntu runner)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get install -y ./dist/rnfs_*_amd64.deb
          rnfs --version
          python3 packaging/smoke_test.py /usr/bin/rnfs
          sudo apt-get remove -y rnfs
      - name: Install and smoke test (Debian 12, Python 3.11)
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:12 sh -ec '
            apt-get update -qq
            apt-get install -y -qq ./dist/rnfs_*_amd64.deb >/dev/null
            python3 --version
            python3 packaging/smoke_test.py /usr/bin/rnfs'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  flatpak-sources:
    name: flatpak sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # The Flatpak's wheels must be the ones packaging/requirements.lock pins (what every other package
      # installs): regenerate them from the lock and fail if that changes the committed files
      - name: Check the pinned Flatpak wheels match packaging/requirements.lock
        run: |
          python -I packaging/flatpak/generate-sources.py
          git diff --exit-code -- packaging/flatpak || {
            echo "::error::packaging/flatpak/*.json is out of date: run python3 packaging/flatpak/generate-sources.py and commit"
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: flatpak-sources
          path: packaging/flatpak/*.json

  flatpak:
    needs: [version, flatpak-sources]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: flatpak-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3  # v6
        with:
          manifest-path: packaging/flatpak/io.github.afit21.rnfs.yml
          bundle: rnfs.flatpak
          arch: x86_64
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Install and smoke test the bundle
        # Best effort: running sandboxed apps inside the CI container depends on the runner's kernel settings
        continue-on-error: true
        run: |
          flatpak install --user -y --noninteractive rnfs.flatpak
          flatpak run io.github.afit21.rnfs --version
          if command -v python3 >/dev/null; then
            mkdir -p "$HOME/smoke-tmp"
            TMPDIR="$HOME/smoke-tmp" python3 packaging/smoke_test.py flatpak run io.github.afit21.rnfs
          fi
      - name: Name it for the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mv rnfs.flatpak "rnfs-$VERSION-x86_64.flatpak"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-flatpak-x86_64
          path: rnfs-*.flatpak
          if-no-files-found: error

  windows:
    name: windows exe
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # The dependencies are the exact versions and files in packaging/requirements.lock (hash-checked)
      - name: Install rnfs, its locked dependencies and PyInstaller
        shell: bash  # stops at the first failing command (pwsh would only check the last one)
        run: |
          python -m pip install --require-hashes -r packaging/requirements.lock
          python -m pip install --no-deps .
          python -m pip install pyinstaller==6.22.3
      - name: Build the one-file exe
        run: pyinstaller --clean --noconfirm packaging/pyinstaller/rnfs.spec
      - name: Smoke test (--version, --help, daemon + status)
        run: python packaging/smoke_test.py dist/rnfs.exe
        timeout-minutes: 10
      - name: Name it for the release
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mv dist/rnfs.exe "dist/rnfs-$VERSION-windows-x64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-windows-x64
          path: dist/rnfs-*-windows-x64.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, python, deb, flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        # A release already made for this tag on GitHub's release page gets the files attached (replacing any
        # with the same names) rather than failing; otherwise the release is created here
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "rnfs $VERSION" \
              --generate-notes \
              --verify-tag
          fi
