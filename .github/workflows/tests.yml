name: tests

on:
  push:
    branches: ["**"]  # not tags: the release workflow runs these jobs itself before publishing
  pull_request:
  workflow_call:  # from release.yml, which grants no more than contents: read

# Read-only token: these jobs only check out and test the code
permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment says which tag); update both together.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # no token left in .git/config for the build code that runs next
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      # The dependencies and the build backend at the versions and hashes in packaging/, built without build
      # isolation (which would fetch the newest setuptools)
      - name: Install
        shell: bash  # stops at the first failing command (pwsh would only check the last one)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements.lock
          python -m pip install --require-hashes --only-binary=:all: -r packaging/build-backend.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Unit tests
        run: python -m unittest discover tests
      # On Windows the daemons are started in their own process groups and stopped with CTRL_BREAK_EVENT. Every
      # module gated on RNFS_E2E is listed here (test_packaging checks it): the embedded node and the security
      # regressions that need real RNS included
      - name: End-to-end tests (real daemons over local TCP)
        env:
          RNFS_E2E: "1"
        run: >-
          python -m unittest tests.test_e2e tests.test_client tests.test_embedded tests.security.test_h1_real_rns
          tests.security.test_m1_real_rns tests.security.test_h2_display_page_pins
        timeout-minutes: 20
      - name: Command works
        run: rnfs --version

  # ruff with the rules in pyproject.toml (pyflakes, syntax errors, a few bugbear checks), and no merge-conflict
  # markers left in any file
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install the build tools (packaging/build-tools.lock, hash-checked)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/build-tools.lock
      - name: ruff
        run: ruff check .
      - name: No merge-conflict markers
        run: "! git grep -nE '^(<<<<<<<|>>>>>>>)( |$)|^=======$' -- . ':!*.lock'"

  # The packages the release workflow builds, smoke-tested: wheel/sdist, .deb, install.sh, PyInstaller binary
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # no token left in .git/config for the build code that runs next
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install the build tools (packaging/build-tools.lock, hash-checked)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/build-tools.lock
      - name: Wheel and sdist
        run: |
          python -m build --no-isolation
          twine check dist/*
          ! tar tzf dist/rnfs-*.tar.gz | grep -q '/tests/'
          tar tzf dist/rnfs-*.tar.gz | grep -q '/packaging/requirements.lock$'
      - name: Shell scripts parse as POSIX sh
        run: sh -n install.sh && sh -n packaging/build-deb.sh
      - name: .deb builds, installs and runs
        run: |
          sh packaging/build-deb.sh --out dist
          sudo apt-get install -y ./dist/rnfs_*_amd64.deb
          python packaging/smoke_test.py /usr/bin/rnfs
          sudo apt-get remove -y rnfs
      - name: install.sh installs, updates and uninstalls (from this checkout)
        env:
          RNFS_SOURCE: ${{ github.workspace }}
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          # Run it from a directory with a planted venv.py and pip/: the installer must not import them
          planted="$RUNNER_TEMP/planted" && mkdir -p "$planted/pip"
          for f in venv.py pip/__init__.py pip/__main__.py; do
            echo "open('$planted/IMPORTED', 'w').write('$f')" > "$planted/$f"
          done
          (cd "$planted" && dash "$GITHUB_WORKSPACE/install.sh")
          test ! -e "$planted/IMPORTED"
          "$HOME/.local/share/rnfs/venv/bin/python" -m pip freeze | grep -qx "$(grep -o '^rns==[^ ]*' packaging/requirements.lock)"
          python packaging/smoke_test.py "$HOME/.local/bin/rnfs"
          dash install.sh --update
          dash install.sh --uninstall
          test ! -e "$HOME/.local/bin/rnfs" && test ! -e "$HOME/.local/share/rnfs"
      # In a clean venv with the dependencies and PyInstaller from the locks, as the release's Windows exe is built
      - name: PyInstaller one-file binary (the spec the Windows exe uses)
        run: |
          python -m venv "$RUNNER_TEMP/pyi"
          "$RUNNER_TEMP/pyi/bin/python" -m pip install --require-hashes --only-binary=:all: -r packaging/build-tools.lock
          "$RUNNER_TEMP/pyi/bin/python" -m pip install --require-hashes --only-binary=:all: -r packaging/requirements.lock
          "$RUNNER_TEMP/pyi/bin/python" -m pip install --no-deps --no-build-isolation .
          "$RUNNER_TEMP/pyi/bin/python" -m pip check
          "$RUNNER_TEMP/pyi/bin/pyinstaller" --clean --noconfirm packaging/pyinstaller/rnfs.spec
          python packaging/smoke_test.py dist/rnfs
