name: tests

on:
  push:
  pull_request:

# Read-only token: these jobs only check out and test the code
permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment says which tag); update both together.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover tests
      # On Windows the daemons are started in their own process groups and stopped with CTRL_BREAK_EVENT
      - name: End-to-end tests (real daemons over local TCP)
        env:
          RNFS_E2E: "1"
        run: python -m unittest tests.test_e2e tests.test_client
        timeout-minutes: 10
      - name: Command works
        run: rnfs --version

  # The packages the release workflow builds, smoke-tested: wheel/sdist, .deb, install.sh, PyInstaller binary
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Wheel and sdist
        run: |
          python -m build
          twine check dist/*
          ! tar tzf dist/rnfs-*.tar.gz | grep -q '/tests/'
          tar tzf dist/rnfs-*.tar.gz | grep -q '/packaging/requirements.lock$'
      - name: Shell scripts parse as POSIX sh
        run: sh -n install.sh && sh -n packaging/build-deb.sh
      - name: .deb builds, installs and runs
        run: |
          sh packaging/build-deb.sh --out dist
          sudo apt-get install -y ./dist/rnfs_*_amd64.deb
          python packaging/smoke_test.py /usr/bin/rnfs
          sudo apt-get remove -y rnfs
      - name: install.sh installs, updates and uninstalls (from this checkout)
        env:
          RNFS_SOURCE: ${{ github.workspace }}
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          # Run it from a directory with a planted venv.py and pip/: the installer must not import them
          planted="$RUNNER_TEMP/planted" && mkdir -p "$planted/pip"
          for f in venv.py pip/__init__.py pip/__main__.py; do
            echo "open('$planted/IMPORTED', 'w').write('$f')" > "$planted/$f"
          done
          (cd "$planted" && dash "$GITHUB_WORKSPACE/install.sh")
          test ! -e "$planted/IMPORTED"
          "$HOME/.local/share/rnfs/venv/bin/python" -m pip freeze | grep -qx "$(grep -o '^rns==[^ ]*' packaging/requirements.lock)"
          python packaging/smoke_test.py "$HOME/.local/bin/rnfs"
          dash install.sh --update
          dash install.sh --uninstall
          test ! -e "$HOME/.local/bin/rnfs" && test ! -e "$HOME/.local/share/rnfs"
      # In a clean venv with the dependencies from the lock, as the release's Windows exe is built
      - name: PyInstaller one-file binary (the spec the Windows exe uses)
        run: |
          python -m venv "$RUNNER_TEMP/pyi"
          "$RUNNER_TEMP/pyi/bin/python" -m pip install --require-hashes -r packaging/requirements.lock
          "$RUNNER_TEMP/pyi/bin/python" -m pip install --no-deps .
          "$RUNNER_TEMP/pyi/bin/python" -m pip install pyinstaller==6.22.3
          "$RUNNER_TEMP/pyi/bin/pyinstaller" --clean --noconfirm packaging/pyinstaller/rnfs.spec
          python packaging/smoke_test.py dist/rnfs
