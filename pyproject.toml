[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rnfs"
dynamic = ["version"]
description = "Content-addressed file sharing over Reticulum, with the functional features of IPFS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rns>=1.5.6", "lxmf>=1.2.0"]
keywords = ["reticulum", "rns", "ipfs", "mesh", "lora", "content-addressed", "file-sharing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/afit21/rnfs"

[project.scripts]
rnfs = "rnfs.cli:main"

[tool.setuptools.packages.find]
include = ["rnfs*"]

[tool.setuptools.dynamic]
version = {attr = "rnfs.__init__.__version__"}  # not "rnfs": setuptools would find rnfs.py
