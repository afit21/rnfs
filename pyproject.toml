[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rnfs"
version = "0.1.0"
description = "Content-addressed file sharing over Reticulum, with the functional features of IPFS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rns>=1.5.6"]
keywords = ["reticulum", "rns", "ipfs", "mesh", "lora", "content-addressed", "file-sharing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/afit21/rnfs"

[project.scripts]
rnfs = "rnfs.cli:main"

[tool.setuptools.packages.find]
include = ["rnfs*"]
