[build-system]
# The upper bound is the major version after packaging/build-backend.lock's (which install.sh, build-deb.sh and
# the workflows build with, hash-checked and without build isolation); raise both together
requires = ["setuptools>=64,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "rnfs"
dynamic = ["version"]
description = "Content-addressed file sharing over Reticulum, with the functional features of IPFS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rns>=1.5.6,<1.6"]
keywords = ["reticulum", "rns", "ipfs", "mesh", "lora", "content-addressed", "file-sharing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/afit21/rnfs"

[project.scripts]
rnfs = "rnfs.cli:main"

[tool.setuptools.packages.find]
include = ["rnfs*"]

[tool.setuptools.dynamic]
version = {attr = "rnfs.__init__.__version__"}  # not "rnfs": setuptools would find rnfs.py

[tool.ruff]
target-version = "py311"
# docs/simulations: the research scripts behind the 0.2.0 plan, kept as they were run, not rnfs code
extend-exclude = ["packaging/flatpak", "docs/simulations"]
# The companion NomadNet pages are Python scripts named index.mu
extension = { mu = "python" }
extend-include = ["companion-nomadnet-sites/*/index.mu"]

[tool.ruff.lint]
# pyflakes, syntax errors, mutable/call defaults, raise-from; broad excepts (each carries a noqa with its reason),
# imports not at the top (each carries a noqa), noqa comments that suppress nothing, and APIs Windows lacks (each
# use carries a noqa naming its guard: below)
select = ["F", "E9", "B006", "B008", "B904", "BLE001", "E402", "RUF100", "TID251"]

# Code runs on Windows too (the Windows exe, and every test in CI), where these don't exist: a use is guarded (os.name,
# fsutil.IS_WINDOWS, hasattr, or a test skipped by tests/support.py's POSIX_MODES, HAS_FIFO or CAN_SYMLINK) and says
# so: `# noqa: TID251 - <the guard>`. CONTRIBUTING.md, "Tests on every OS"
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.geteuid".msg = "Windows has no os.geteuid: guard it and say how (# noqa: TID251 - <the guard>)"
"os.getuid".msg = "Windows has no os.getuid: guard it and say how (# noqa: TID251 - <the guard>)"
