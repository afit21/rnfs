# Optional extra sandboxing for the rnfs systemd user unit (contrib/rnfs.service, or the unit install.sh or
# the .deb installs), as a drop-in. In a user unit it adds little: the daemon runs as you, so the system
# directories ProtectSystem=full makes read-only were never writable by it, and a compromised daemon can still
# write your home folder (~/.bashrc, ~/.config/autostart, ~/.config/systemd/user) and ask your systemd user
# manager to start processes outside the sandbox. strict.conf, next to this file, closes most of that (its
# comments say what it leaves open), at the cost of where `rnfs get -o` can write; it includes these settings.
#
#   mkdir -p ~/.config/systemd/user/rnfs.service.d
#   cp contrib/rnfs.service.d/hardening.conf ~/.config/systemd/user/rnfs.service.d/
#   systemctl --user daemon-reload && systemctl --user restart rnfs
#   systemctl --user status rnfs          # check that it started
#
# To undo it, delete the file, then daemon-reload and restart again.
#
# These aren't in the unit itself: in a user unit (run by your own systemd --user, not as root) they need
# unprivileged user namespaces, which some distributions and hardened kernels turn off, and the unit then fails
# to start. Also, the daemon is what reads the files `rnfs add` names and writes the ones `rnfs get` and
# `rnfs export` write, so with PrivateTmp a path under /tmp or /var/tmp is the daemon's own private one, not
# the /tmp your shell sees.
#
# UMask= is left out, here and in the unit: what `rnfs get` writes gets its permissions from your umask, as any
# command's output does.

[Service]
# /usr, /boot, /efi and /etc read-only for the daemon and any program a PipeInterface starts (in a user unit,
# only what root's permissions already keep it from writing)
ProtectSystem=full
# Private /tmp and /var/tmp: other processes don't see the daemon's temporary files, nor it theirs
PrivateTmp=yes
