# Opt-in stricter sandboxing for the rnfs systemd user unit (contrib/rnfs.service, or the unit install.sh or the
# .deb installs), as a drop-in. It needs unprivileged user namespaces, as hardening.conf does (see there), and
# includes hardening.conf's settings, so use one or the other.
#
#   mkdir -p ~/.rnfs ~/.reticulum ~/Downloads     # they must exist before it starts (see below)
#   mkdir -p ~/.config/systemd/user/rnfs.service.d
#   cp contrib/rnfs.service.d/strict.conf ~/.config/systemd/user/rnfs.service.d/
#   systemctl --user daemon-reload && systemctl --user restart rnfs
#   systemctl --user status rnfs          # check that it started
#
# To undo it, delete the file, then daemon-reload and restart again.
#
# What it changes: the daemon (and any program a PipeInterface starts) sees your home folder read-only, except
# ~/.rnfs, ~/.reticulum and ~/Downloads, and can't reach your systemd user manager or session bus. So a daemon
# compromised through the network input it parses can no longer write ~/.bashrc, ~/.profile, ~/.config/autostart,
# ~/.config/systemd/user and the like, nor ask systemd (systemd-run --user) to start a process outside this
# sandbox (where the session bus is $XDG_RUNTIME_DIR/bus, as on current systemd distributions; an older
# abstract-socket session bus stays reachable). The plain unit can do all of that, and hardening.conf doesn't stop it: in a user unit, everything
# ProtectSystem=full protects is root's and was never writable by the daemon anyway.
#
# What it doesn't: it can still write ~/.reticulum, and Reticulum programs you run outside this unit (rnsd,
# NomadNet, Sideband, ...) execute what that config names (a PipeInterface's command, interfaces/*.py), so this
# narrows the ways out rather than closing them. It can still read the rest of your home, except ~/.ssh and
# ~/.gnupg; and it can write outside your home wherever you can (a data disk under /mnt or /media), which
# ProtectSystem=strict would stop too, at the cost of /tmp (see PrivateTmp below) and any other such paths you'd
# then list in ReadWritePaths.
#
# What it costs: `rnfs get -o` and `rnfs export` (the daemon writes their output) work only into ~/Downloads,
# ~/.rnfs, ~/.reticulum, a private /tmp, or the folders you add; a path elsewhere in your home fails with a
# read-only or permission error. `rnfs add` still reads anything you can, except ~/.ssh and ~/.gnupg. If your
# Reticulum config is in ~/.config/reticulum, your Downloads folder is elsewhere (xdg-user-dir DOWNLOAD), or
# rnfs.toml points rnfs at another directory, add those. Add folders with `systemctl --user edit rnfs`:
#
#   [Service]
#   ReadWritePaths=%h/Videos /mnt/data
#
# A path prefixed with - is skipped when it doesn't exist, so the unit still starts; rnfs then can't create it,
# being under the read-only home, which is why the mkdir above comes first.

[Service]
# hardening.conf's: /usr, /boot, /efi and /etc read-only; a private /tmp and /var/tmp
ProtectSystem=full
PrivateTmp=yes
# The home folder read-only, except rnfs's and Reticulum's directories and Downloads (%h is your home)
ProtectHome=read-only
ReadWritePaths=-%h/.rnfs -%h/.reticulum -%h/Downloads
# No reading SSH and GnuPG keys, and nothing in your runtime directory (%t, $XDG_RUNTIME_DIR): the systemd user
# manager and the session bus, through which a process can start others outside this sandbox, and the ssh and
# gpg agents. Reticulum's shared instance is an abstract socket and Bluetooth RNodes use the system bus, which
# both stay reachable
InaccessiblePaths=-%h/.ssh -%h/.gnupg -%t
